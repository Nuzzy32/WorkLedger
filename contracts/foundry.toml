[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
